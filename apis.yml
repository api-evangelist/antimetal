- aid: antimetal:antimetal-agent-apis
  name: Antimetal Agent APIs (Protobuf)
  description: >-
    Public protobuf/Connect definitions for the Antimetal system agent — the component that connects customer
    infrastructure to the Antimetal platform. Covers agent config and instance, hardware and Linux runtime
    telemetry, Kubernetes cluster and relationship modelling, network, and a generic resource/object graph
    with an intake service. Published as a buf module.
  humanURL: https://github.com/antimetal/apis
