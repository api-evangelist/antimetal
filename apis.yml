apis:
- aid: antimetal:antimetal-mcp-server
  name: Antimetal MCP Server
  description: >-
    Remote Model Context Protocol server exposing Antimetal's investigation, root-cause analysis and remediation
    capabilities to MCP-compatible clients such as Claude Code, Cursor, VS Code, Windsurf and Codex. Supports
    OAuth 2.1 (WorkOS AuthKit, with dynamic client registration and device authorization) or an API key
    presented as a bearer token. Anonymous tools/list is rejected with 401.
  humanURL: https://docs.antimetal.com/connect
  baseURL: https://mcp.antimetal.com
  tags:
  - MCP
  - Agents
  - Incident Management
