aid: antimetal
name: Antimetal
description: Antimetal is a New York based software company building an autonomous production-management
  platform for engineering teams — "everything that happens after you deploy". It maintains
  a continuously updated world model of a customer's production stack and runs specialized
  AI agents that patrol for risk and drift, triage noisy signals into structured issues, investigate
  incidents down to a root cause, and generate production-ready fixes tied back to the underlying
  evidence. It connects to more than ninety cloud, observability, CI/CD, incident and code
  tools — AWS, Google Cloud, Azure, Kubernetes, Datadog, Grafana, Prometheus, Sentry, Splunk,
  New Relic, Honeycomb, PagerDuty, incident.io, GitHub, Vercel and Slack among them. Antimetal
  publishes a public REST API (the Antimetal External API, at bff.antimetal.com/api/v2) covering
  issues, investigation results, evidential artifacts and a natural-language query endpoint,
  a remote MCP server at mcp.antimetal.com with OAuth 2.1 and API-key auth, an official TypeScript
  SDK, published Agent Skills for Claude Code and Cursor, open protobuf definitions for its
  infrastructure agent, and a Terraform provider and Helm charts.
